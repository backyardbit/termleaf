name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check

  kitty-untouched:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git fetch --no-tags --depth=1 origin master
      - name: src/kitty.rs, src/encoder.rs and src/shelf.rs match master
        run: git diff --stat --exit-code FETCH_HEAD HEAD -- src/kitty.rs src/encoder.rs src/shelf.rs

  e2e:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies, Xvfb, ImageMagick, xterm and xdotool
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev xvfb imagemagick libgl1-mesa-dri xterm xdotool
      - name: Install Ghostty
        run: |
          gh release download 1.3.1-0-ppa2 --repo mkasberg/ghostty-ubuntu --pattern 'ghostty_*_amd64_24.04.deb' --dir "$RUNNER_TEMP/ghostty"
          sudo apt-get install -y "$RUNNER_TEMP"/ghostty/*.deb
      - name: Install herdr
        run: |
          gh release download v0.9.1 --repo herdrdev/herdr --pattern herdr-linux-x86_64 --output "$RUNNER_TEMP/herdr"
          sudo install -m 755 "$RUNNER_TEMP/herdr" /usr/local/bin/herdr
          mkdir -p ~/.config/herdr
          printf 'onboarding = false\n' > ~/.config/herdr/config.toml
      - name: Install tmux, Vim, Neovim 0.10.4 and Helix 25.07.1
        run: |
          sudo apt-get install -y tmux vim
          gh release download v0.10.4 --repo neovim/neovim --pattern nvim-linux-x86_64.tar.gz --dir "$RUNNER_TEMP/nvim"
          sudo tar -C /opt -xzf "$RUNNER_TEMP/nvim/nvim-linux-x86_64.tar.gz"
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          gh release download 25.07.1 --repo helix-editor/helix --pattern helix-25.07.1-x86_64-linux.tar.xz --dir "$RUNNER_TEMP/helix"
          sudo tar -C /opt -xJf "$RUNNER_TEMP/helix/helix-25.07.1-x86_64-linux.tar.xz"
          sudo ln -sf /opt/helix-25.07.1-x86_64-linux/hx /usr/local/bin/hx
          tmux -V
          vim --version | head -n 1
          nvim --version | head -n 1
          hx --version
      - name: Install zellij 0.45.1 and GNU screen
        run: |
          sudo apt-get install -y screen
          gh release download v0.45.1 --repo zellij-org/zellij --pattern zellij-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/zellij"
          sudo tar -C /usr/local/bin -xzf "$RUNNER_TEMP/zellij/zellij-x86_64-unknown-linux-musl.tar.gz" zellij
          zellij --version
          screen --version
      - name: Install kitty 0.41.1 and WezTerm 20240203-110809-5046fc22
        run: |
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-xkb1 libegl1 libegl-mesa0
          gh release download v0.41.1 --repo kovidgoyal/kitty --pattern kitty-0.41.1-x86_64.txz --dir "$RUNNER_TEMP/kitty"
          sudo mkdir -p /opt/kitty
          sudo tar -C /opt/kitty -xJf "$RUNNER_TEMP/kitty/kitty-0.41.1-x86_64.txz"
          sudo ln -sf /opt/kitty/bin/kitty /usr/local/bin/kitty
          gh release download 20240203-110809-5046fc22 --repo wezterm/wezterm --pattern wezterm-20240203-110809-5046fc22.Ubuntu22.04.tar.xz --dir "$RUNNER_TEMP/wezterm"
          sudo mkdir -p /opt/wezterm
          sudo tar -C /opt/wezterm -xJf "$RUNNER_TEMP/wezterm/wezterm-20240203-110809-5046fc22.Ubuntu22.04.tar.xz"
          sudo ln -sf /opt/wezterm/wezterm/usr/bin/wezterm /usr/local/bin/wezterm
          sudo ln -sf /opt/wezterm/wezterm/usr/bin/wezterm-mux-server /usr/local/bin/wezterm-mux-server
          kitty --version
          wezterm --version
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" cargo xtask e2e
      - name: Sixel in xterm -ti vt340
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" cargo xtask xterm
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx in tmux
        run: cargo xtask tmux
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx in herdr
        run: cargo xtask herdr
      - name: Alt+click jumps nvim over its socket with no multiplexer
        run: cargo xtask plain
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx in zellij
        run: cargo xtask zellij
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx in GNU screen
        run: cargo xtask screen
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx between kitty windows
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" cargo xtask kitty
      - name: Alt+click, Ctrl+click and e jump nvim, vim and hx between WezTerm panes
        run: cargo xtask wezterm
      - name: vim with the follow snippet and termleaf --follow move termleaf once per page
        run: cargo xtask follow
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            target/e2e/screenshots
            target/e2e/ghostty.log
            target/xterm
