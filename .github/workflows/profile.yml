name: profile

on:
  workflow_dispatch:
  push:
    branches: [t3/evaluate-pixelgui-performance]

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies, Xvfb, xterm and MuPDF tools
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev xvfb libgl1-mesa-dri xterm mupdf-tools tmux libnss3 libgbm1 libasound2t64 libxkbcommon-x11-0 libxcb-xkb1 libegl1 libegl-mesa0
      - name: Let Electron's sandbox create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Ghostty
        run: |
          gh release download 1.3.1-0-ppa2 --repo mkasberg/ghostty-ubuntu --pattern 'ghostty_*_amd64_24.04.deb' --dir "$RUNNER_TEMP/ghostty"
          sudo apt-get install -y "$RUNNER_TEMP"/ghostty/*.deb
      - name: Install herdr
        run: |
          gh release download v0.9.1 --repo herdrdev/herdr --pattern herdr-linux-x86_64 --output "$RUNNER_TEMP/herdr"
          sudo install -m 755 "$RUNNER_TEMP/herdr" /usr/local/bin/herdr
          mkdir -p ~/.config/herdr
          printf 'onboarding = false\n' > ~/.config/herdr/config.toml
      - name: Install zellij 0.45.1
        run: |
          gh release download v0.45.1 --repo zellij-org/zellij --pattern zellij-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/zellij"
          sudo tar -C /usr/local/bin -xzf "$RUNNER_TEMP/zellij/zellij-x86_64-unknown-linux-musl.tar.gz" zellij
      - name: Install kitty 0.41.1 and WezTerm 20240203-110809-5046fc22
        run: |
          gh release download v0.41.1 --repo kovidgoyal/kitty --pattern kitty-0.41.1-x86_64.txz --dir "$RUNNER_TEMP/kitty"
          sudo mkdir -p /opt/kitty
          sudo tar -C /opt/kitty -xJf "$RUNNER_TEMP/kitty/kitty-0.41.1-x86_64.txz"
          sudo ln -sf /opt/kitty/bin/kitty /usr/local/bin/kitty
          gh release download 20240203-110809-5046fc22 --repo wezterm/wezterm --pattern wezterm-20240203-110809-5046fc22.Ubuntu22.04.tar.xz --dir "$RUNNER_TEMP/wezterm"
          sudo mkdir -p /opt/wezterm
          sudo tar -C /opt/wezterm -xJf "$RUNNER_TEMP/wezterm/wezterm-20240203-110809-5046fc22.Ubuntu22.04.tar.xz"
          sudo ln -sf /opt/wezterm/wezterm/usr/bin/wezterm /usr/local/bin/wezterm
          sudo ln -sf /opt/wezterm/wezterm/usr/bin/wezterm-gui /usr/local/bin/wezterm-gui
      - name: Install the PixelGUI viewer and its Electron runtime
        working-directory: xtask/profile/pixel-pages
        run: npm ci --no-audit --no-fund
      - uses: Swatinem/rust-cache@v2
      - name: Scroll termleaf and the PixelGUI viewer through the same keys in each terminal and multiplexer
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" cargo xtask profile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile
          path: |
            target/profile/summary.md
            target/profile/results.json
            target/profile/*/terminal.log
            target/profile/*/events
            target/profile/*/pixel-info.json
            ~/.local/state/pixel/logs
