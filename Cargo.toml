[package]
name = "termleaf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A live-reloading PDF viewer for the terminal, built for editing LaTeX next to it"
repository = "https://github.com/backyardbit/termleaf"
readme = "README.md"
keywords = ["pdf", "viewer", "terminal", "latex", "tui"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1"
base64-simd = "0.8"
crossterm = "0.29"
image = { version = "0.25", default-features = false }
mupdf = "0.8"
notify = "8"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[lints]
workspace = true

[workspace]
members = ["xtask"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
as_underscore = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
